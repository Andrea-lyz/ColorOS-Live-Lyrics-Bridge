name: Bridge Preview

# Signed non-latest previews from feature tags. Artwork previews include the pinned artwork
# Provider; contract-selected previews may also build the pinned Universal Provider.
# Formal releases and their final RC/device gates remain on release.yml; no LSP mirror here.

on:
  push:
    tags:
      - "v*-Preview"
      - "v*-Artwork"

permissions:
  contents: write

concurrency:
  group: cll-preview-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "21"

jobs:
  preview:
    name: Build signed Bridge preview and publish pre-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bridge
        uses: actions/checkout@v6

      - name: Resolve preview metadata
        id: meta
        shell: pwsh
        env:
          PREVIEW_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $versionName = $env:PREVIEW_TAG.Substring(1)
          $notes = ".github/release-notes/$versionName.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
              throw "Missing preview release notes: $notes"
          }
          $contract = Get-Content -LiteralPath release/bridge-release-contract.json -Raw | ConvertFrom-Json
          $artwork = $env:PREVIEW_TAG -like '*-Artwork' -or $env:PREVIEW_TAG -like '*-Artwork-Preview'
          $universal = @($contract.previewUniversalProvider.previewTags) -contains $env:PREVIEW_TAG
          if ($universal -and -not $artwork) { throw 'Universal preview requires the pinned Providers checkout' }
          if ($artwork) {
              $artworkProvider = $contract.previewArtworkProvider
              if ($null -eq $artworkProvider) {
                  throw "Tag $($env:PREVIEW_TAG) needs contract.previewArtworkProvider"
              }
              "artwork_repository=$($artworkProvider.repository)" >> $env:GITHUB_OUTPUT
              "artwork_ref=$($artworkProvider.ref)" >> $env:GITHUB_OUTPUT
              "artwork_task=$($artworkProvider.buildTask)" >> $env:GITHUB_OUTPUT
          }
          if ($universal) {
              $u = $contract.previewUniversalProvider
              if ($u.repository -ne $artworkProvider.repository -or $u.ref -ne $artworkProvider.ref) {
                  throw 'Preview Providers must use the same immutable checkout'
              }
              "universal_task=$($u.buildTask)" >> $env:GITHUB_OUTPUT
              "universal_test_task=$($u.testTask)" >> $env:GITHUB_OUTPUT
              "universal_module=$($u.module)" >> $env:GITHUB_OUTPUT
          }
          "universal=$($universal.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "tag=$($env:PREVIEW_TAG)" >> $env:GITHUB_OUTPUT
          "notes=$notes" >> $env:GITHUB_OUTPUT
          "artwork=$($artwork.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Checkout pinned artwork Provider source
        if: steps.meta.outputs.artwork == 'true'
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.meta.outputs.artwork_repository }}
          ref: ${{ steps.meta.outputs.artwork_ref }}
          path: provider-source

      - name: Validate the artwork contract mirror and both contracts
        if: steps.meta.outputs.artwork == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./provider-source/scripts/verify-artwork-contract.ps1 -RepoRoot "$env:GITHUB_WORKSPACE/provider-source" -BridgeRepoRoot $env:GITHUB_WORKSPACE -Required
          ./provider-source/scripts/validate-v5-release-contract.ps1 -RepoRoot "$env:GITHUB_WORKSPACE/provider-source"
          ./scripts/validate-release-contract.ps1 -ProviderRepoRoot "$env:GITHUB_WORKSPACE/provider-source"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate Bridge release contract
        shell: pwsh
        run: ./scripts/validate-release-contract.ps1

      - name: Decode release keystore
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test, lint, and build signed Bridge
        shell: bash
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PREVIEW_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon \
            :app:testDebugUnitTest \
            :app:lintRelease \
            :app:assembleRelease \
            -PreleaseTag="$PREVIEW_TAG"

      - name: Build signed Dynamic Artwork Provider
        if: steps.meta.outputs.artwork == 'true'
        shell: bash
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./provider-source/gradlew
          ./provider-source/gradlew --no-daemon -p ./provider-source ${{ steps.meta.outputs.artwork_task }}
          apk=$(find ./provider-source/artwork-provider-am/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          test -n "$apk"
          echo "ARTWORK_APK=$apk" >> "$GITHUB_ENV"

      - name: Test and build signed Universal Provider
        if: steps.meta.outputs.universal == 'true'
        shell: bash
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          UNIVERSAL_MODULE: ${{ steps.meta.outputs.universal_module }}
        run: |
          set -euo pipefail
          ./provider-source/gradlew --no-daemon -p ./provider-source ${{ steps.meta.outputs.universal_test_task }} ${{ steps.meta.outputs.universal_task }}
          mapfile -t apks < <(find "./provider-source/$UNIVERSAL_MODULE/build/outputs/apk/release" -maxdepth 1 -name '*.apk')
          test "${#apks[@]}" -eq 1
          echo "UNIVERSAL_APK=${apks[0]}" >> "$GITHUB_ENV"

      - name: Remove release keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Locate Android build tools
        id: build_tools
        shell: pwsh
        run: |
          $contract = Get-Content -LiteralPath release/bridge-release-contract.json -Raw | ConvertFrom-Json
          $buildToolsDir = Join-Path $env:ANDROID_SDK_ROOT "build-tools/$($contract.androidBuildToolsVersion)"
          foreach ($tool in @('aapt2', 'apksigner', 'zipalign')) {
              if (-not (Test-Path -LiteralPath (Join-Path $buildToolsDir $tool) -PathType Leaf)) {
                  throw "Pinned Android build tool is missing: $buildToolsDir/$tool"
              }
          }
          "dir=$buildToolsDir" >> $env:GITHUB_OUTPUT

      - name: Verify and stage preview assets
        shell: pwsh
        env:
          PREVIEW_TAG: ${{ steps.meta.outputs.tag }}
          BUILD_TOOLS: ${{ steps.build_tools.outputs.dir }}
        run: |
          ./scripts/build-preview-assets.ps1 `
            -ApkPath app/build/outputs/apk/release/app-release.apk `
            -OutputDir ./preview-assets `
            -BuildToolsDir $env:BUILD_TOOLS `
            -PreviewTag $env:PREVIEW_TAG `
            -ArtworkApkPath $env:ARTWORK_APK `
            -UniversalApkPath $env:UNIVERSAL_APK

      - name: Remove the artwork Provider checkout
        if: always()
        shell: bash
        run: rm -rf ./provider-source

      - name: Upload preview assets
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.tag }}
          path: preview-assets/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_TAG: ${{ steps.meta.outputs.tag }}
          NOTES_FILE: ${{ steps.meta.outputs.notes }}
        run: |
          set -euo pipefail
          if gh release view "$PREVIEW_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Preview Release already exists; refusing to overwrite its assets: $PREVIEW_TAG" >&2
            exit 1
          fi
          mapfile -d '' assets < <(find preview-assets -maxdepth 1 -type f -print0 | sort -z)
          gh release create "$PREVIEW_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --latest=false \
            --title "$PREVIEW_TAG" \
            --notes-file "$NOTES_FILE"

      - name: Verify published pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(gh release view "$PREVIEW_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = "true"
          expected="$(find preview-assets -maxdepth 1 -type f | wc -l)"
          published="$(gh release view "$PREVIEW_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
          test "$published" -eq "$expected"
          latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          test "$latest" != "$PREVIEW_TAG"
