name: Build 4.1 RC and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      mode:
        description: "RC only uploads a private Actions artifact; release is tag-only."
        required: true
        type: choice
        options:
          - rc
          - release
        default: rc
      rc_number:
        description: "Positive RC sequence number. Used only in rc mode."
        required: true
        default: "1"
        type: string
      providers_ref:
        description: "Immutable Provider tag or full 40-character commit SHA."
        required: true
        default: "providers-v1.1.0"
        type: string

permissions:
  contents: write

concurrency:
  group: cll-4-1-release-${{ github.ref }}-${{ inputs.mode || 'tag' }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "21"
  PROVIDERS_REPOSITORY: Andrea-lyz/ColorOS-Live-Lyrics-Providers
  LSP_REPOSITORY: Xposed-Modules-Repo/io.github.andrealtb.lockscreenlyrics

jobs:
  metadata:
    name: Resolve immutable release inputs
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.meta.outputs.mode }}
      batch: ${{ steps.meta.outputs.batch }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      version_name: ${{ steps.meta.outputs.version_name }}
      lsp_tag: ${{ steps.meta.outputs.lsp_tag }}
      bridge_sha: ${{ steps.meta.outputs.bridge_sha }}
      providers_sha: ${{ steps.meta.outputs.providers_sha }}
      providers_ref: ${{ steps.meta.outputs.providers_ref }}
    steps:
      - name: Checkout Bridge
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout immutable Provider source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.PROVIDERS_REPOSITORY }}
          ref: ${{ inputs.providers_ref || 'providers-v1.1.0' }}
          path: provider-source
          fetch-depth: 0
          token: ${{ secrets.PROVIDERS_REPO_TOKEN || github.token }}

      - name: Validate cross-repository contracts
        shell: pwsh
        run: ./scripts/validate-release-contract.ps1 -ProviderRepoRoot ./provider-source

      - name: Resolve metadata and reject mutable inputs
        id: meta
        shell: pwsh
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_RC_NUMBER: ${{ inputs.rc_number }}
          REQUESTED_PROVIDERS_REF: ${{ inputs.providers_ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          $contract = Get-Content -LiteralPath release/bridge-release-contract.json -Raw | ConvertFrom-Json
          $eventName = '${{ github.event_name }}'
          $mode = if ($eventName -eq 'push') { 'release' } else { $env:REQUESTED_MODE }
          if ($mode -notin @('rc', 'release')) {
              throw "Unsupported release mode: $mode"
          }
          if ($mode -eq 'release') {
              if ($eventName -ne 'push' -or '${{ github.ref_type }}' -ne 'tag') {
                  throw 'Public release mode is allowed only from a pushed tag.'
              }
              if ('${{ github.ref_name }}' -ne $contract.releaseTag) {
                  throw "Pushed tag does not match contract: ${{ github.ref_name }}"
              }
          }

          $providersRef = if ([string]::IsNullOrWhiteSpace($env:REQUESTED_PROVIDERS_REF)) {
              [string]$contract.providersSourceTag
          } else {
              $env:REQUESTED_PROVIDERS_REF
          }
          $providersSha = (git -C provider-source rev-parse HEAD).Trim()
          $bridgeSha = (git rev-parse HEAD).Trim()
          if ($providersSha -notmatch '^[0-9a-f]{40}$' -or $bridgeSha -notmatch '^[0-9a-f]{40}$') {
              throw 'Unable to resolve full source commits.'
          }

          $providerTags = @((git -C provider-source tag --points-at HEAD) | ForEach-Object { $_.Trim() })
          $isFullSha = $providersRef -match '^[0-9a-fA-F]{40}$'
          $isExactTag = $providerTags -contains $providersRef
          if (-not $isFullSha -and -not $isExactTag) {
              throw "providers_ref must be a full SHA or a tag pointing at HEAD: $providersRef"
          }
          if ($mode -eq 'release' -and -not ($providerTags -contains $contract.providersSourceTag)) {
              throw "GA Provider commit is not tagged $($contract.providersSourceTag)."
          }

          if ($mode -eq 'rc') {
              if ($env:REQUESTED_RC_NUMBER -notmatch '^[1-9][0-9]*$') {
                  throw 'rc_number must be a positive integer.'
              }
              $batch = "$($contract.suiteVersion)-rc.$($env:REQUESTED_RC_NUMBER)-$($bridgeSha.Substring(0, 7))-$($providersSha.Substring(0, 7))"
          } else {
              $batch = $contract.suiteVersion
          }

          "mode=$mode" >> $env:GITHUB_OUTPUT
          "batch=$batch" >> $env:GITHUB_OUTPUT
          "release_tag=$($contract.releaseTag)" >> $env:GITHUB_OUTPUT
          "version_name=$($contract.suiteVersion)" >> $env:GITHUB_OUTPUT
          "lsp_tag=$($contract.lspTag)" >> $env:GITHUB_OUTPUT
          "bridge_sha=$bridgeSha" >> $env:GITHUB_OUTPUT
          "providers_sha=$providersSha" >> $env:GITHUB_OUTPUT
          "providers_ref=$providersRef" >> $env:GITHUB_OUTPUT

  build-bridge:
    name: Test and build signed Bridge
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bridge
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate Bridge release contract
        shell: pwsh
        run: ./scripts/validate-release-contract.ps1

      - name: Decode release keystore
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '${{ secrets.SIGNING_KEY }}' | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test, lint, and build signed Bridge
        shell: bash
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon \
            :app:testDebugUnitTest \
            :app:lintRelease \
            :app:assembleRelease \
            -PreleaseTag='${{ needs.metadata.outputs.release_tag }}'

      - name: Stage canonical Bridge asset
        shell: pwsh
        run: |
          $contract = Get-Content -LiteralPath release/bridge-release-contract.json -Raw | ConvertFrom-Json
          New-Item -ItemType Directory -Path out -Force | Out-Null
          Copy-Item -LiteralPath app/build/outputs/apk/release/app-release.apk -Destination (Join-Path out $contract.bridgeAsset)

      - name: Upload Bridge APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.metadata.outputs.batch }}-bridge
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove release keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/release.jks"

  build-providers:
    name: Test and build signed 12-Provider matrix
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable Provider source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.PROVIDERS_REPOSITORY }}
          ref: ${{ needs.metadata.outputs.providers_sha }}
          token: ${{ secrets.PROVIDERS_REPO_TOKEN || github.token }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate Provider release contract
        shell: pwsh
        run: ./scripts/validate-v5-release-contract.ps1

      - name: Decode release keystore
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '${{ secrets.SIGNING_KEY }}' | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test and build signed Provider matrix
        shell: bash
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon testV5Matrix --rerun-tasks
          ./gradlew --no-daemon assembleV5MatrixRelease --build-cache

      - name: Collect canonical Provider assets
        shell: pwsh
        run: ./scripts/collect-v5-release-apks.ps1 -OutputDir ./out

      - name: Upload Provider APKs
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.metadata.outputs.batch }}-providers
          path: |
            out/*.apk
            out/v5-provider-matrix.json
          if-no-files-found: error
          retention-days: 14

      - name: Remove release keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/release.jks"

  package:
    name: Verify, inventory, and bundle RC assets
    needs:
      - metadata
      - build-bridge
      - build-providers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bridge
        uses: actions/checkout@v6

      - name: Checkout immutable Provider source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.PROVIDERS_REPOSITORY }}
          ref: ${{ needs.metadata.outputs.providers_sha }}
          path: provider-source
          token: ${{ secrets.PROVIDERS_REPO_TOKEN || github.token }}

      - name: Download signed APK artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: ${{ needs.metadata.outputs.batch }}-*
          path: incoming
          merge-multiple: true

      - name: Locate Android build tools
        id: build_tools
        shell: pwsh
        run: |
          $contract = Get-Content -LiteralPath release/bridge-release-contract.json -Raw | ConvertFrom-Json
          $buildToolsDir = Join-Path $env:ANDROID_SDK_ROOT "build-tools/$($contract.androidBuildToolsVersion)"
          foreach ($tool in @('aapt2', 'apksigner', 'zipalign')) {
              if (-not (Test-Path -LiteralPath (Join-Path $buildToolsDir $tool) -PathType Leaf)) {
                  throw "Pinned Android build tool is missing: $buildToolsDir/$tool"
              }
          }
          "dir=$buildToolsDir" >> $env:GITHUB_OUTPUT

      - name: Verify and package release assets
        shell: pwsh
        run: |
          ./scripts/build-release-assets.ps1 `
            -InputDir ./incoming `
            -OutputDir ./release-assets `
            -ProviderRepoRoot ./provider-source `
            -BuildToolsDir '${{ steps.build_tools.outputs.dir }}' `
            -Batch '${{ needs.metadata.outputs.batch }}' `
            -BridgeCommit '${{ needs.metadata.outputs.bridge_sha }}' `
            -ProviderCommit '${{ needs.metadata.outputs.providers_sha }}'

      - name: Upload complete RC batch
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.metadata.outputs.batch }}-complete
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub and LSP releases
    if: needs.metadata.outputs.mode == 'release'
    needs:
      - metadata
      - package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bridge
        uses: actions/checkout@v6

      - name: Download verified release batch
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.metadata.outputs.batch }}-complete
          path: release-assets

      - name: Require release notes and pre-created LSP tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.LSP_REPO_TOKEN }}
          LSP_TAG: ${{ needs.metadata.outputs.lsp_tag }}
        run: |
          set -euo pipefail
          test -f ".github/release-notes/${{ needs.metadata.outputs.version_name }}.md"
          gh api "repos/${LSP_REPOSITORY}/git/ref/tags/${LSP_TAG}" >/dev/null

      - name: Publish Bridge GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
        run: |
          set -euo pipefail
          notes_file=".github/release-notes/${{ needs.metadata.outputs.version_name }}.md"
          mapfile -d '' assets < <(find release-assets -maxdepth 1 -type f -print0 | sort -z)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Bridge Release already exists; refusing to overwrite public assets: $RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" --notes-file "$notes_file"

      - name: Publish LSP mirror Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.LSP_REPO_TOKEN }}
          RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
          LSP_TAG: ${{ needs.metadata.outputs.lsp_tag }}
        run: |
          set -euo pipefail
          notes_file=".github/release-notes/${{ needs.metadata.outputs.version_name }}.md"
          body_file="$RUNNER_TEMP/lsp-release-body.md"
          cp "$notes_file" "$body_file"
          {
            printf '\n\n<!-- donation:start -->\n'
            printf '## Donate\n\n'
            printf '<img src="https://raw.githubusercontent.com/%s/main/PY_QR.png" alt="WeChat and Alipay donation QR code" width="600" height="400">\n' "$LSP_REPOSITORY"
            printf '<!-- donation:end -->\n'
          } >> "$body_file"
          mapfile -d '' assets < <(find release-assets -maxdepth 1 -type f -print0 | sort -z)
          if gh release view "$LSP_TAG" --repo "$LSP_REPOSITORY" >/dev/null 2>&1; then
            echo "LSP Release already exists; refusing to overwrite public assets: $LSP_TAG" >&2
            exit 1
          fi
          gh release create "$LSP_TAG" "${assets[@]}" --repo "$LSP_REPOSITORY" --title "$RELEASE_TAG" --notes-file "$body_file"

      - name: Verify published release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.LSP_REPO_TOKEN }}
          RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
          LSP_TAG: ${{ needs.metadata.outputs.lsp_tag }}
        run: |
          set -euo pipefail
          expected="$(find release-assets -maxdepth 1 -type f | wc -l)"
          bridge_count="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
          lsp_count="$(gh release view "$LSP_TAG" --repo "$LSP_REPOSITORY" --json assets --jq '.assets | length')"
          test "$bridge_count" -eq "$expected"
          test "$lsp_count" -eq "$expected"
